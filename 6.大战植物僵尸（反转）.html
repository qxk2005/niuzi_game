<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大战植物僵尸 - 反转奇妙大冒险 (原版PVZ画风+僵王BOSS版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #090d16;
      font-family: 'Segoe UI', Microsoft YaHei, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 960px;
      height: 640px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px rgba(74, 222, 128, 0.25);
      border-radius: 20px;
      overflow: hidden;
      background: #1e293b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 20px;
    }

    /* Modern UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Navigation / Sun Counter Bar */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .resource-badge {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 3px solid #fbbf24;
      border-radius: 30px;
      padding: 6px 20px 6px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .resource-icon {
      width: 42px;
      height: 42px;
      background: radial-gradient(circle, #fef08a 0%, #eab308 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.8);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 10px rgba(234, 179, 8, 0.6); }
      to { transform: scale(1.1); box-shadow: 0 0 22px rgba(234, 179, 8, 1); }
    }

    .resource-val {
      font-size: 28px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .controls-right {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: rgba(30, 41, 59, 0.88);
      border: 2px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
    }

    .btn-icon:hover {
      transform: translateY(-2px) scale(1.05);
      background: rgba(51, 65, 85, 0.95);
      border-color: #38bdf8;
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    /* Cards Plant Toolbar */
    .cards-container {
      position: absolute;
      top: 75px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .card-slot {
      width: 82px;
      height: 86px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 3px solid #64748b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .card-slot.selected {
      border-color: #facc15;
      background: rgba(234, 179, 8, 0.28);
      transform: scale(1.08) translateX(6px);
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
    }

    .card-slot.disabled {
      opacity: 0.5;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .card-emoji {
      font-size: 32px;
      line-height: 36px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    .card-name {
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      text-align: center;
      white-space: nowrap;
    }

    .card-cost {
      background: rgba(0, 0, 0, 0.75);
      color: #fde047;
      font-weight: 900;
      font-size: 12px;
      padding: 1px 8px;
      border-radius: 10px;
    }

    /* Zomboss Boss Health Bar Overlay */
    .boss-bar-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 48px;
      background: rgba(15, 23, 42, 0.92);
      border: 3px solid #ef4444;
      border-radius: 25px;
      padding: 4px 14px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
      z-index: 25;
    }

    .boss-title-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 13px;
      font-weight: 900;
      color: #fca5a5;
      margin-bottom: 3px;
    }

    .boss-hp-track {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .boss-hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #f97316, #facc15);
      transition: width 0.2s ease;
      box-shadow: 0 0 10px #ef4444;
    }

    /* Dialog / Assistant Speech Bubble for 5yo */
    .assistant-bubble {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 3px solid #38bdf8;
      border-radius: 25px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 720px;
      width: 92%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 30;
      animation: bounceIn 0.4s ease;
    }

    @keyframes bounceIn {
      0% { transform: translate(-50%, 40px) scale(0.8); opacity: 0; }
      70% { transform: translate(-50%, -5px) scale(1.04); }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }

    .assistant-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 2px solid #fff;
      flex-shrink: 0;
    }

    .assistant-text {
      color: #f1f5f9;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    /* Screen Modal System */
    .screen-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .modal-title {
      font-size: 46px;
      font-weight: 900;
      background: linear-gradient(90deg, #facc15, #f97316, #ec4899, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
    }

    .modal-desc {
      font-size: 19px;
      color: #cbd5e1;
      max-width: 640px;
      line-height: 1.6;
      margin-bottom: 28px;
      background: rgba(255,255,255,0.06);
      padding: 18px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      text-align: left;
    }

    .btn-primary {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #052e16;
      font-size: 26px;
      font-weight: 900;
      padding: 16px 48px;
      border-radius: 50px;
      border: 3px solid #fff;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(22, 163, 74, 0.6), inset 0 3px 6px rgba(255,255,255,0.6);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-primary:hover {
      transform: scale(1.06);
      background: linear-gradient(180deg, #86efac 0%, #22c55e 100%);
      box-shadow: 0 15px 35px rgba(22, 163, 74, 0.8);
    }

    .btn-primary:active {
      transform: scale(0.95);
    }

    .hand-pointer {
      position: absolute;
      font-size: 48px;
      pointer-events: none;
      z-index: 50;
      animation: handBounce 1s infinite alternate ease-in-out;
    }

    @keyframes handBounce {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(15px, 15px) scale(1.15); }
    }
  </style>
</head>
<body>

<div id="game-container">

  <!-- Dynamic UI Layer -->
  <div class="ui-layer">
    <!-- Top Resource Bar & Controls -->

      <div class="resource-badge">

    <div class="assistant-bubble" id="assistant-bubble">
      <div class="assistant-avatar" id="assistant-avatar">🌻</div>
      <div class="assistant-text" id="assistant-text">欢迎小朋友！我是向日葵队长！快用豌豆射手收集能量吧！</div>

    <!-- Animated Hand Guide Pointer -->
    <div class="hand-pointer" id="hand-pointer" style="display: none;">👈</div>
  </div>

  <!-- Screen Modal System -->
  <div class="screen-modal" id="screen-modal">
    <div class="modal-title" id="modal-title">🌻 大战植物僵尸 🧟</div>
    <div class="modal-desc" id="modal-desc">
      在这个奇妙颠倒世界里：<br>
      • <b>豌豆射手</b> 变成了生产豌豆阳光能量的宝贝！<br>
      • <b>向日葵战将</b> 变成了发射太阳光束的强大炮塔！<br>
      • <b>普通僵尸</b> 还原为经典原版普通僵尸（绿皮西装红领带）！<br>
      • <b>终极关卡</b> 迎来真正的巨型<b>僵王博士机甲 BOSS</b>大决战！<br>
      准备好体验原版画风与巨型僵王大决战了吗？
    </div>
    <button class="btn-primary interactive" onclick="startGame()">
      <span>🚀</span> 开始大冒险！
    </button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// 1. 常量与基础配置
// ═══════════════════════════════════════════════════════════════════════════
const W = 960, H = 640;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = W;
  canvas.height = H;
}
resizeCanvas();

// 网格布局 (5行 x 9列)
const GRID = {
  left: 120,
  top: 85,
  cols: 9,
  rows: 5,
  cw: 88,
  ch: 104
};

// 游戏状态
const GAME_STATES = {
  START: 'START',
  PLAYING: 'PLAYING',
  LEVEL_CLEAR: 'LEVEL_CLEAR',
  VICTORY: 'VICTORY'
};

let gameState = GAME_STATES.START;
let currentLevelIndex = 0;
let peaEnergy = 150;
let selectedCard = null;
let soundEnabled = true;

// ═══════════════════════════════════════════════════════════════════════════
// 2. 音效与 Web Audio / TTS 语音系统
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    
    if (type === 'plant') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'collect') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      osc.frequency.setValueAtTime(783.99, now + 0.16);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'shoot') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'explode') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'zomboss_roar') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.6);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'house') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.25, now + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.3);
      });
    }
  } catch (e) { console.log(e); }
}

function speakText(text) {
  if (!soundEnabled) return;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.pitch = 1.3;
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

function updateAssistantText(text, avatar = '🌻') {
  document.getElementById('assistant-text').innerText = text;
  document.getElementById('assistant-avatar').innerText = avatar;
  speakText(text);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  btn.innerHTML = soundEnabled ? '🔊 声音' : '🔇 静音';
  if (!soundEnabled && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// 3. 植物与卡牌数据
// ═══════════════════════════════════════════════════════════════════════════
const PLANT_CARDS = [

  { id: 'cherry', name: '樱桃炸弹', cost: 150, cooldown: 12, emoji: '🍒', desc: '爱心大爆炸，清空范围敌方！', color: '#ef4444' }
];

// 关卡配置 (含第4关僵王大决战)
const LEVELS = [
  {
    name: '第 1 关：普通僵尸初体验',
    desc: '教小朋友：豌豆射手会产生能量豆！向日葵负责射击！击退第一波经典普通僵尸！',
    unlockedCards: ['peashooter', 'sunflower'],

    ],
    hasBoss: false,

  {

    desc: '解锁【坚果墙】！路障僵尸与铁桶僵尸登场，坚果墙可以挡住敌人的进攻！',
    unlockedCards: ['peashooter', 'sunflower', 'wallnut'],
    zombiesToSpawn: [
      { type: 'normal', delay: 2 },
      { type: 'conehead', delay: 8 },
      { type: 'buckethead', delay: 14 },
      { type: 'conehead', delay: 20 }
    ],
    hasBoss: false,
    hint: '路障和铁桶防具厚！种个【坚果墙】挡住他，向日葵在后面安全射击！'
  },
  {
    name: '第 3 关：地刺与樱桃爆炸大狂欢',
    desc: '解锁【地刺】、【寒冰射手】与【樱桃炸弹】！享受全屏大爆炸大冲锋！',
    unlockedCards: ['peashooter', 'sunflower', 'wallnut', 'spikeweed', 'snowpea', 'cherry'],
    zombiesToSpawn: [
      { type: 'normal', delay: 2 },
      { type: 'conehead', delay: 6 },
      { type: 'buckethead', delay: 10 },
      { type: 'conehead', delay: 14 },
      { type: 'buckethead', delay: 18 }
    ],
    hasBoss: false,
    hint: '敌军太多时，用【樱桃炸弹】把他们炸飞！【寒冰射手】还能把僵尸冻结冻慢！'
  },
  {
    name: '第 4 关：终极关卡 · 僵王博士大决战！',
    desc: '警报！巨型【僵王博士】驾驶钢铁机甲出现！发射火球、踩踏地面并召唤僵尸大军！',
    unlockedCards: ['peashooter', 'sunflower', 'wallnut', 'spikeweed', 'snowpea', 'cherry'],
    zombiesToSpawn: [
      { type: 'normal', delay: 4 },
      { type: 'conehead', delay: 12 },
      { type: 'buckethead', delay: 22 }
    ],
    hasBoss: true,
    hint: '终极 BOSS 战！用向日葵战将攻击巨型僵王机甲！用樱桃炸弹炸伤僵王！'
  }
];

// ═══════════════════════════════════════════════════════════════════════════
// 4. 游戏实体定义
// ═══════════════════════════════════════════════════════════════════════════
let plants = [];
let zombies = [];
let boss = null;
let bossProjectiles = [];
let projectiles = [];
let suns = [];
let daveHouses = [];
let particles = [];
let spawnTimer = 0;
let levelZombiesLeft = [];

// 戴夫安全小屋
class DaveHouse {
  constructor(row) {
    this.row = row;
    this.x = GRID.left - 75;
    this.y = GRID.top + row * GRID.ch + 10;
    this.active = false;
    this.speed = 12;
  }

  update() {
    if (this.active) {
      this.x += this.speed;
      zombies.forEach(z => {
        if (z.row === this.row && Math.abs(z.x - this.x) < 50) {
          z.hp = 0;
          createExplosion(z.x, z.y, '#f59e0b', 12);
          playSound('explode');
        }
      });
      if (boss && Math.abs(boss.x - this.x) < 60) {
        boss.takeDamage(150);
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = '#b45309';
    ctx.fillRect(10, 25, 55, 45);
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(0, 25); ctx.lineTo(37, 0); ctx.lineTo(75, 25);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#78350f';
    ctx.fillRect(28, 40, 20, 30);
    ctx.font = '24px sans-serif';
    ctx.fillText('🏠', 22, 50);
    ctx.restore();
  }
}

// 阳光/能量豆
class PeaSun {
  constructor(x, y, targetY) {
    this.x = x; this.y = y;
    this.targetY = targetY || y;
    this.size = 24; this.vy = targetY ? 2 : 0;
    this.collected = false; this.life = 600; this.pulse = 0;
  }

  update() {
    if (this.y < this.targetY) this.y += this.vy;
    this.pulse += 0.08; this.life--;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    const scale = 1 + Math.sin(this.pulse) * 0.12;
    ctx.scale(scale, scale);
    ctx.beginPath(); ctx.arc(0, 0, this.size + 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(250, 204, 21, 0.4)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, this.size);
    grad.addColorStop(0, '#fef08a'); grad.addColorStop(0.5, '#4ade80'); grad.addColorStop(1, '#16a34a');
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-6, -6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = '14px sans-serif'; ctx.fillText('🫛', -8, 6);
    ctx.restore();
  }
}

// 植物发射的太阳/冰霜子弹
class SunBullet {
  constructor(x, y, row, isIce = false) {
    this.x = x; this.y = y; this.row = row;
    this.isIce = isIce;
    this.speed = 8;
    this.damage = isIce ? 30 : 35;
    this.size = 14;
    this.rotation = 0;
  }

  update() {
    this.x += this.speed;
    this.rotation += 0.1;

    // 命中普通僵尸
    zombies.forEach(z => {
      if (z.row === this.row && z.x > this.x - 20 && z.x < this.x + 30) {
        z.takeDamage(this.damage);
        if (this.isIce) z.slowTimer = 120;
        createExplosion(this.x, this.y, this.isIce ? '#38bdf8' : '#fde047', 8);
        playSound('shoot');
        this.x = W + 200;
      }
    });

    // 命中僵王机甲
    if (boss && boss.hp > 0 && Math.abs(boss.x - this.x) < 50) {
      boss.takeDamage(this.damage);
      createExplosion(this.x, this.y, this.isIce ? '#38bdf8' : '#fde047', 8);
      playSound('shoot');
      this.x = W + 200;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    if (this.isIce) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
      ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2); ctx.fillRect(this.size - 2, -2, 6, 4);
      }
    } else {
      ctx.fillStyle = 'rgba(250, 204, 21, 0.85)';
      ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f97316';
      for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4); ctx.fillRect(this.size - 2, -2, 6, 4);
      }
    }
    ctx.restore();
  }
}

// 僵王滚球 (火球/冰球)
class BossProjectile {
  constructor(row, isIce = false) {
    this.row = row;
    this.isIce = isIce;
    this.x = W - 120;
    this.y = GRID.top + row * GRID.ch + GRID.ch / 2;
    this.speed = 4.5;
    this.radius = 28;
    this.rotation = 0;
  }

  update() {
    this.x -= this.speed;
    this.rotation -= 0.1;

    plants.forEach(p => {
      if (p.row === this.row && Math.abs(p.x - this.x) < 35) {
        p.hp -= 20;
        createExplosion(p.x, p.y, this.isIce ? '#38bdf8' : '#ef4444', 6);
      }
    });

    if (this.x < GRID.left - 40) {
      this.x = -200;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.isIce ? '#0284c7' : '#dc2626'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = this.isIce ? '#93c5fd' : '#fde047'; ctx.stroke();

    ctx.font = '28px sans-serif';
    ctx.fillText(this.isIce ? '🧊' : '🔥', -14, 10);
    ctx.restore();
  }
}

// 植物类 (支持 PVZ 经典视觉)
class Plant {
  constructor(cardId, col, row) {
    this.cardId = cardId;
    this.col = col;
    this.row = row;
    this.x = GRID.left + col * GRID.cw + GRID.cw / 2;
    this.y = GRID.top + row * GRID.ch + GRID.ch / 2 + 10;
    this.hp = cardId === 'wallnut' ? 900 : 250;
    this.maxHp = this.hp;
    this.timer = 0;
    this.animOffset = Math.random() * Math.PI * 2;
  }

  update() {
    this.timer++;
    this.animOffset += 0.05;

    if (this.cardId === 'peashooter') {
      if (this.timer % 240 === 0) {
        suns.push(new PeaSun(this.x, this.y - 20, this.y + 15));
        playSound('collect');
      }
    } else if (this.cardId === 'sunflower') {
      const targetZombies = zombies.some(z => z.row === this.row && z.x > this.x);
      const targetBoss = boss && boss.hp > 0;
      if ((targetZombies || targetBoss) && this.timer % 90 === 0) {
        projectiles.push(new SunBullet(this.x + 20, this.y - 15, this.row, false));
        playSound('shoot');
      }
    } else if (this.cardId === 'snowpea') {
      const targetZombies = zombies.some(z => z.row === this.row && z.x > this.x);
      const targetBoss = boss && boss.hp > 0;
      if ((targetZombies || targetBoss) && this.timer % 100 === 0) {
        projectiles.push(new SunBullet(this.x + 20, this.y - 15, this.row, true));
        playSound('shoot');
      }
    } else if (this.cardId === 'cherry') {
      if (this.timer >= 90) {
        this.explode();
      }
    }
  }

  explode() {
    playSound('explode');
    createExplosion(this.x, this.y, '#ef4444', 40);
    zombies.forEach(z => {
      if (Math.abs(z.row - this.row) <= 1 && Math.abs(z.x - this.x) <= 150) {
        z.takeDamage(1000);
      }
    });
    if (boss && boss.hp > 0 && Math.abs(boss.x - this.x) < 180) {
      boss.takeDamage(400);
    }
    this.hp = 0;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    const bounce = Math.sin(this.animOffset) * 4;

    if (this.cardId === 'peashooter') {
      ctx.translate(0, bounce);
      ctx.fillStyle = '#16a34a';
      ctx.beginPath(); ctx.ellipse(-15, 20, 15, 8, -0.2, 0, Math.PI * 2);
      ctx.ellipse(15, 20, 15, 8, 0.2, 0, Math.PI * 2); ctx.fill();

      ctx.lineWidth = 8; ctx.strokeStyle = '#22c55e';
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.quadraticCurveTo(-5, 0, 0, -10); ctx.stroke();

      ctx.beginPath(); ctx.arc(0, -15, 22, 0, Math.PI * 2);
      ctx.fillStyle = '#4ade80'; ctx.fill();
      ctx.strokeStyle = '#15803d'; ctx.lineWidth = 3; ctx.stroke();

      ctx.beginPath(); ctx.ellipse(18, -15, 10, 14, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#22c55e'; ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-2, -20, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, -21, 1.5, 0, Math.PI * 2); ctx.fill();

    } else if (this.cardId === 'sunflower') {
      ctx.translate(0, bounce);
      ctx.fillStyle = '#facc15';
      const petals = 12;
      for (let i = 0; i < petals; i++) {
        ctx.rotate((Math.PI * 2) / petals);
        ctx.beginPath(); ctx.ellipse(0, -26, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
      }

      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#78350f'; ctx.fill();

      ctx.fillStyle = '#fff'; ctx.beginPath();
      ctx.arc(-6, -5, 5, 0, Math.PI * 2); ctx.arc(6, -5, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath();
      ctx.arc(-5, -5, 2.5, 0, Math.PI * 2); ctx.arc(7, -5, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.arc(0, 3, 8, 0.1, Math.PI - 0.1); ctx.stroke();

    } else if (this.cardId === 'snowpea') {
      ctx.translate(0, bounce);
      ctx.fillStyle = '#0284c7';
      ctx.beginPath(); ctx.ellipse(-15, 20, 15, 8, -0.2, 0, Math.PI * 2);
      ctx.ellipse(15, 20, 15, 8, 0.2, 0, Math.PI * 2); ctx.fill();

      ctx.lineWidth = 8; ctx.strokeStyle = '#0284c7';
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.quadraticCurveTo(-5, 0, 0, -10); ctx.stroke();

      ctx.beginPath(); ctx.arc(0, -15, 22, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8'; ctx.fill();
      ctx.strokeStyle = '#0369a1'; ctx.lineWidth = 3; ctx.stroke();

      ctx.beginPath(); ctx.ellipse(18, -15, 10, 14, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7'; ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-2, -20, 4, 0, Math.PI * 2); ctx.fill();

    } else if (this.cardId === 'wallnut') {
      ctx.translate(0, bounce / 2);
      ctx.beginPath(); ctx.ellipse(0, 0, 24, 30, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#d97706'; ctx.fill();
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3; ctx.stroke();

      const hpRatio = this.hp / this.maxHp;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(-8, -8, 3, 0, Math.PI * 2); ctx.arc(8, -8, 3, 0, Math.PI * 2); ctx.fill();

      if (hpRatio > 0.6) {
        ctx.beginPath(); ctx.arc(0, 2, 10, 0, Math.PI); ctx.stroke();
      } else if (hpRatio > 0.3) {
        ctx.strokeStyle = '#451a03'; ctx.beginPath();
        ctx.moveTo(-10, -15); ctx.lineTo(-4, -5); ctx.lineTo(-12, 5); ctx.stroke();
      } else {
        ctx.strokeStyle = '#451a03'; ctx.beginPath();
        ctx.moveTo(-12, -15); ctx.lineTo(-4, -5); ctx.lineTo(-12, 10);
        ctx.moveTo(6, -10); ctx.lineTo(14, 0); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(-8, 0, 3, 0, Math.PI * 2); ctx.fill();
      }

    } else if (this.cardId === 'spikeweed') {
      ctx.fillStyle = '#a16207';
      for (let i = -30; i <= 30; i += 15) {
        ctx.beginPath(); ctx.moveTo(i, 25);
        ctx.lineTo(i + 7, 5 + Math.sin(this.animOffset * 2 + i) * 4);
        ctx.lineTo(i + 14, 25); ctx.fill();
      }
    } else if (this.cardId === 'cherry') {
      ctx.font = '38px sans-serif'; ctx.fillText('🍒', -19, 10);
    }

    ctx.restore();
  }
}

// 原版经典僵尸类 (普通僵尸、路障僵尸、铁桶僵尸)
class Zombie {
  constructor(type, row) {
    this.type = type;
    this.row = row;
    this.x = W + 40;
    this.y = GRID.top + row * GRID.ch + GRID.ch / 2 + 10;
    this.hp = type === 'buckethead' ? 700 : (type === 'conehead' ? 450 : 250);
    this.maxHp = this.hp;
    this.speed = type === 'buckethead' ? 0.55 : (type === 'conehead' ? 0.65 : 0.75);
    this.atk = 1.2;
    this.animOffset = Math.random() * 10;
    this.isEating = false;
    this.slowTimer = 0;
  }

  update() {
    this.animOffset += 0.08;
    this.isEating = false;

    if (this.slowTimer > 0) this.slowTimer--;
    const currentSpeed = this.slowTimer > 0 ? this.speed * 0.5 : this.speed;

    plants.forEach(p => {
      if (p.row === this.row && Math.abs(p.x - this.x) < 35 && p.cardId !== 'spikeweed') {
        this.isEating = true;
        p.hp -= this.atk;
      }
    });

    plants.forEach(p => {
      if (p.row === this.row && p.cardId === 'spikeweed' && Math.abs(p.x - this.x) < 40) {
        this.hp -= 0.6;
      }
    });

    if (!this.isEating) {
      this.x -= currentSpeed;
    }

    if (this.x <= GRID.left - 20) {
      const house = daveHouses.find(h => h.row === this.row);
      if (house && !house.active) {
        house.active = true;
        playSound('house');
        updateAssistantText('哇！疯狂戴夫的小屋弹飞了整行敌人！真安全！', '🏠');
      }
    }
  }

  takeDamage(amount) {
    this.hp -= amount;
    createExplosion(this.x, this.y, '#64748b', 6);
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    const sway = Math.sin(this.animOffset) * 6;
    ctx.rotate(sway * 0.02);

    if (this.slowTimer > 0) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.beginPath(); ctx.arc(0, -10, 32, 0, Math.PI * 2); ctx.fill();
    }

    // 原版僵尸身体
    ctx.fillStyle = '#451a03';
    ctx.fillRect(-12, -8, 24, 38);

    // 白色衬衫与红色领带
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(-4, -8, 8, 25);
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(-2, -5, 4, 18);

    // 蓝色裤子
    ctx.fillStyle = '#1e3a8a';
    ctx.fillRect(-10, 30, 8, 20);
    ctx.fillRect(2, 30, 8, 20);

    // 原版僵尸头部 (绿皮)
    ctx.fillStyle = '#84cc16';
    ctx.beginPath(); ctx.arc(0, -24, 19, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(-8, -38, 3, 0, Math.PI * 2);
    ctx.arc(0, -40, 4, 0, Math.PI * 2);
    ctx.arc(7, -38, 3, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6, -26, 6, 0, Math.PI * 2); ctx.arc(6, -26, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5, -26, 2.5, 0, Math.PI * 2); ctx.arc(7, -26, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3f6212';
    ctx.beginPath(); ctx.arc(0, -16, 8, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-4, -16, 3, 4); ctx.fillRect(2, -16, 3, 4);

    if (this.type === 'conehead') {
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(-16, -34); ctx.lineTo(0, -66); ctx.lineTo(16, -34);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(-10, -48, 20, 6);
    } else if (this.type === 'buckethead') {
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(-18, -52, 36, 22);
      ctx.fillStyle = '#64748b'; ctx.fillRect(-20, -32, 40, 5);
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(-12, -48, 6, 14);
    }

    if (this.hp < this.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-20, -74, 40, 6);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(-20, -74, (this.hp / this.maxHp) * 40, 6);
    }

    ctx.restore();
  }
}

// 终极 BOSS：僵王博士
class Zomboss {
  constructor() {
    this.x = W - 110;
    this.y = H / 2 + 10;
    this.hp = 2500;
    this.maxHp = 2500;
    this.animTimer = 0;
    this.attackTimer = 0;
    this.summonTimer = 0;
    this.phase = 1;
  }

  update() {
    if (this.hp <= 0) return;

    this.animTimer += 0.05;
    this.attackTimer++;
    this.summonTimer++;

    if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
      this.phase = 2;
      playSound('zomboss_roar');
      updateAssistantText('警告！僵王博士进入第二阶段狂暴状态！技能变快啦！', '🔥');
    }

    const fireInterval = this.phase === 2 ? 240 : 360;
    const summonInterval = this.phase === 2 ? 300 : 450;

    if (this.attackTimer >= fireInterval) {
      this.attackTimer = 0;
      const targetRow = Math.floor(Math.random() * GRID.rows);
      const isIce = Math.random() > 0.5;
      bossProjectiles.push(new BossProjectile(targetRow, isIce));
      playSound('zomboss_roar');
      updateAssistantText(`小心！僵王博士向第 ${targetRow + 1} 行发射了滚球巨弹！`, '💥');
    }

    if (this.summonTimer >= summonInterval) {
      this.summonTimer = 0;
      const count = this.phase === 2 ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const rRow = Math.floor(Math.random() * GRID.rows);
        const zType = Math.random() > 0.5 ? 'conehead' : 'buckethead';
        zombies.push(new Zombie(zType, rRow));
      }
      playSound('zomboss_roar');
      updateAssistantText('警报！僵王博士召唤了一大波强力僵尸大军！', '🧟');
    }

    const fill = document.getElementById('boss-hp-fill');
    const num = document.getElementById('boss-hp-num');
    if (fill && num) {
      const pct = Math.max(0, (this.hp / this.maxHp) * 100);
      fill.style.width = pct + '%';
      num.innerText = `${Math.max(0, Math.floor(this.hp))} / ${this.maxHp}`;
    }
  }

  takeDamage(amount) {
    if (this.hp <= 0) return;
    this.hp -= amount;
    createExplosion(this.x - 30 + (Math.random() - 0.5) * 60, this.y - 20 + (Math.random() - 0.5) * 60, '#ef4444', 10);

    if (this.hp <= 0) {
      this.hp = 0;
      createExplosion(this.x, this.y, '#ef4444', 50);
      createExplosion(this.x, this.y - 40, '#facc15', 50);
      zombies = [];
      bossProjectiles = [];
      updateAssistantText('🎉 太棒啦！巨型僵王博士被你彻底击败啦！僵王再也不能召唤僵尸啦！', '🏆');
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    const hover = Math.sin(this.animTimer) * 8;
    ctx.translate(0, hover);

    if (this.phase === 2) {
      ctx.beginPath(); ctx.arc(0, -20, 110, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.18)'; ctx.fill();
    }

    ctx.fillStyle = '#334155';
    ctx.fillRect(-50, 60, 35, 70); ctx.fillRect(15, 60, 35, 70);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-60, 120, 50, 20); ctx.fillRect(10, 120, 50, 20);

    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.roundRect(-80, -40, 160, 110, 20); ctx.fill();
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.stroke();

    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-60, -20, 120, 12);
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.arc(0, -20, 25, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(239, 68, 68, 0.65)';
    ctx.beginPath(); ctx.arc(0, -90, 55, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3; ctx.stroke();

    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.arc(0, -95, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-15, -72, 30, 12);
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(-6, -100, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8, -102, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#facc15'; ctx.beginPath();
    ctx.moveTo(-16, -125); ctx.lineTo(-8, -135); ctx.lineTo(0, -125);
    ctx.lineTo(8, -135); ctx.lineTo(16, -125); ctx.lineTo(18, -118); ctx.lineTo(-18, -118);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-105, -20, 30, 80); ctx.fillRect(75, -20, 30, 80);

    ctx.restore();
  }
}

// 粒子特效
function createExplosion(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 8 + 4,
      color: color, life: 30
    });
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// 5. UI交互与逻辑
// ═══════════════════════════════════════════════════════════════════════════

function renderCardsUI() {
  const container = document.getElementById('cards-bar');
  container.innerHTML = '';
  const activeLevel = LEVELS[currentLevelIndex];

  PLANT_CARDS.forEach(card => {
    if (!activeLevel.unlockedCards.includes(card.id)) return;

    const div = document.createElement('div');
    div.className = `card-slot ${peaEnergy < card.cost ? 'disabled' : ''} ${selectedCard === card.id ? 'selected' : ''}`;
    div.innerHTML = `
      <div class="card-emoji">${card.emoji}</div>
      <div class="card-name">${card.name}</div>
      <div class="card-cost">${card.cost}</div>
    `;

    div.onclick = (e) => {
      e.stopPropagation();
      if (peaEnergy >= card.cost) {
        selectedCard = card.id;
        playSound('plant');
        renderCardsUI();
        if (card.id === 'peashooter') updateAssistantText('已选择豌豆射手！点击草坪种下产生阳光！', '🫛');
        else if (card.id === 'sunflower') updateAssistantText('已选择向日葵战将！极速射击太阳光束！', '🌻');
        else if (card.id === 'snowpea') updateAssistantText('已选择寒冰射手！发射冰霜冻结僵尸！', '❄️');
      }
    };

    container.appendChild(div);
  });
}

function loadLevel(index) {
  currentLevelIndex = index;
  const level = LEVELS[index];

  plants = []; zombies = []; bossProjectiles = []; projectiles = []; suns = []; particles = [];
  peaEnergy = 150; selectedCard = null; spawnTimer = 0;

  const bossBar = document.getElementById('boss-bar');
  if (level.hasBoss) {
    boss = new Zomboss();
    bossBar.style.display = 'flex';
    playSound('zomboss_roar');
  } else {
    boss = null;
    bossBar.style.display = 'none';
  }

  daveHouses = [];
  for (let r = 0; r < GRID.rows; r++) daveHouses.push(new DaveHouse(r));

  levelZombiesLeft = level.zombiesToSpawn.map(z => ({ ...z, spawned: false }));

  document.getElementById('pea-val').innerText = peaEnergy;
  renderCardsUI();
  updateAssistantText(level.hint, '💡');

  const hand = document.getElementById('hand-pointer');
  hand.style.display = 'block'; hand.style.top = '100px'; hand.style.left = '90px';
}

function startGame() {
  document.getElementById('screen-modal').style.display = 'none';
  gameState = GAME_STATES.PLAYING;
  loadLevel(0);
}

function restartLevel() {
  loadLevel(currentLevelIndex);
}

canvas.addEventListener('pointerdown', (e) => {
  if (gameState !== GAME_STATES.PLAYING) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  let collected = false;
  suns.forEach(s => {
    if (!s.collected && Math.hypot(s.x - mx, s.y - my) < 40) {
      s.collected = true; s.life = 0;
      peaEnergy += 25;
      document.getElementById('pea-val').innerText = peaEnergy;
      playSound('collect');
      createExplosion(s.x, s.y, '#fef08a', 8);
      renderCardsUI();
      collected = true;
    }
  });

  if (collected) return;

  if (selectedCard) {
    const cardData = PLANT_CARDS.find(c => c.id === selectedCard);
    if (cardData && peaEnergy >= cardData.cost) {
      const col = Math.floor((mx - GRID.left) / GRID.cw);
      const row = Math.floor((my - GRID.top) / GRID.ch);

      if (col >= 0 && col < GRID.cols && row >= 0 && row < GRID.rows) {
        const existing = plants.find(p => p.col === col && p.row === row);
        if (!existing) {
          plants.push(new Plant(selectedCard, col, row));
          peaEnergy -= cardData.cost;
          document.getElementById('pea-val').innerText = peaEnergy;
          playSound('plant');
          selectedCard = null;
          renderCardsUI();
          document.getElementById('hand-pointer').style.display = 'none';
        }
      }
    }
  }
});

// ═══════════════════════════════════════════════════════════════════════════
// 6. 主循环与渲染
// ═══════════════════════════════════════════════════════════════════════════

function drawBackground() {
  ctx.fillStyle = '#15803d';
  ctx.fillRect(0, 0, W, H);

  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      const x = GRID.left + c * GRID.cw;
      const y = GRID.top + r * GRID.ch;
      ctx.fillStyle = (r + c) % 2 === 0 ? '#22c55e' : '#16a34a';
      ctx.fillRect(x, y, GRID.cw - 2, GRID.ch - 2);
    }
  }

  ctx.fillStyle = '#090d16';
  ctx.fillRect(0, 0, W, GRID.top);
  ctx.fillRect(0, 0, GRID.left - 10, H);
}

function gameLoop() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  if (gameState === GAME_STATES.PLAYING) {
    spawnTimer += 1 / 60;

    levelZombiesLeft.forEach(zData => {
      if (!zData.spawned && spawnTimer >= zData.delay) {
        zData.spawned = true;
        const randomRow = Math.floor(Math.random() * GRID.rows);
        zombies.push(new Zombie(zData.type, randomRow));
      }
    });

    daveHouses.forEach(h => { h.update(); h.draw(); });

    plants = plants.filter(p => p.hp > 0);
    plants.forEach(p => { p.update(); p.draw(); });

    zombies = zombies.filter(z => z.hp > 0);
    zombies.forEach(z => { z.update(); z.draw(); });

    if (boss) {
      boss.update();
      if (boss.hp > 0) boss.draw();
    }

    bossProjectiles = bossProjectiles.filter(bp => bp.x > -100);
    bossProjectiles.forEach(bp => { bp.update(); bp.draw(); });

    projectiles = projectiles.filter(p => p.x < W + 50);
    projectiles.forEach(p => { p.update(); p.draw(); });

    suns = suns.filter(s => s.life > 0);
    suns.forEach(s => { s.update(); s.draw(); });

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      ctx.fillStyle = p.color; ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });

    const level = LEVELS[currentLevelIndex];
    const allSpawned = levelZombiesLeft.every(z => z.spawned);
    const bossDefeated = level.hasBoss && boss && boss.hp <= 0;
    const isLevelWon = level.hasBoss ? bossDefeated : (allSpawned && zombies.length === 0);

    if (isLevelWon) {
      playSound('win');
      if (currentLevelIndex < LEVELS.length - 1) {
        gameState = GAME_STATES.LEVEL_CLEAR;
        showModal('🎉 关卡大胜利！', `太棒了小朋友！你成功通过了 ${LEVELS[currentLevelIndex].name}！继续挑战下一关！`, '下一关 🚀', () => {
          document.getElementById('screen-modal').style.display = 'none';
          gameState = GAME_STATES.PLAYING;
          loadLevel(currentLevelIndex + 1);
        });
      } else {
        gameState = GAME_STATES.VICTORY;
        showModal('🏆 终极全通关大英雄！', '哇！你太厉害啦！你成功击败了终极僵王博士！僵王被打倒后再也不能召唤僵尸啦！你是真正的反转植物僵尸超级大师！', '再玩一遍 🔄', () => {
          document.getElementById('screen-modal').style.display = 'none';
          gameState = GAME_STATES.PLAYING;
          loadLevel(0);
        });
      }
    }
  }

  requestAnimationFrame(gameLoop);
}

function showModal(title, desc, btnText, callback) {
  const modal = document.getElementById('screen-modal');
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-desc').innerHTML = desc;
  const btn = modal.querySelector('.btn-primary');
  btn.innerHTML = `<span>🚀</span> ${btnText}`;
  btn.onclick = callback;
  modal.style.display = 'flex';
}

requestAnimationFrame(gameLoop);

</script>
