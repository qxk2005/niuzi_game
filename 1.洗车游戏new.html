                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(this.w - 12, this.h - 28, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();

                if (this.cleanliness < 100) {
                    ctx.drawImage(this.dirtyCanvas, 0, 0);
                }

                // 🚚 如果是搅拌车，在此绘制专属的 3D 自转搅拌罐与尾部料斗架、出料槽
                if (this.type === 'concrete') {
                    this.drumAngle = (this.drumAngle || 0) + (this.vx * 0.08) + 0.02;

                    ctx.save();
                    ctx.fillStyle = '#475569';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 3;
                    
                    ctx.beginPath();
                    ctx.moveTo(85, this.h - 15);
                    ctx.lineTo(95, this.h - 38);
                    ctx.lineTo(105, this.h - 15);
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(15, this.h - 15);
                    ctx.lineTo(25, this.h - 38);
                    ctx.lineTo(35, this.h - 15);
                    ctx.fill();
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(62, this.h - 52);
                    ctx.rotate(-0.22);
                    
                    ctx.fillStyle = '#f8fafc';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 45, 28, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 45, 28, 0, 0, Math.PI * 2);
                    ctx.clip();

                    ctx.strokeStyle = '#16a34a';
                    ctx.lineWidth = 14;
                    ctx.lineCap = 'round';
                    for (let i = -2; i <= 2; i++) {
                        const ox = i * 36 + (this.drumAngle * 12) % 36;
                        ctx.beginPath();
                        ctx.moveTo(ox - 22, -40);
                        ctx.lineTo(ox + 22, 40);
                        ctx.stroke();
                    }
                    ctx.restore();

                    ctx.fillStyle = '#64748b';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 10, 28, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();

                    ctx.fillStyle = '#64748b';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(5, this.h - 55);
                    ctx.lineTo(20, this.h - 55);
                    ctx.lineTo(15, this.h - 35);
                    ctx.lineTo(5, this.h - 35);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#475569';
                    ctx.save();
                    ctx.translate(5, this.h - 30);
                    ctx.rotate(0.35);
                    ctx.fillRect(-18, -4, 20, 8);
                    ctx.strokeRect(-18, -4, 20, 8);
                    ctx.restore();

                    ctx.restore();
                }

                // 🛠️ 绘制车身受损划痕
                ctx.save();
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.85)';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                // 松动的小螺丝和划痕
                if (!this.damagePoints[0].repaired) {
                    const p = this.damagePoints[0];
                    ctx.beginPath();
                    ctx.moveTo(p.ox - 6, p.oy - 2);
                    ctx.lineTo(p.ox + 6, p.oy + 2);
                    ctx.stroke();
                    
                    // 凸出的小螺丝
                    ctx.fillStyle = '#9ca3af';
                    ctx.strokeStyle = '#374151';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(p.ox, p.oy - 3, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                
                // 车身大刮痕/裂缝
                if (!this.damagePoints[1].repaired) {
                    const p = this.damagePoints[1];
                    ctx.beginPath();
                    ctx.moveTo(p.ox - 12, p.oy - 6);
                    ctx.lineTo(p.ox + 12, p.oy + 6);
                    ctx.moveTo(p.ox - 4, p.oy + 6);
                    ctx.lineTo(p.ox + 8, p.oy - 4);
                    ctx.stroke();
                }
                ctx.restore();

                // 如果被检查过，且未完全修复，则显示警示标志
                if (this.isInspected) {
                    this.damagePoints.forEach(p => {
                        if (!p.repaired) {
                            ctx.save();
                            ctx.translate(p.ox, p.oy);
                            const scale = 1.0 + Math.sin(Date.now() * 0.01) * 0.15;
                            ctx.scale(scale, scale);
                            
                            // 警告圈
                            ctx.strokeStyle = '#ef4444';
                            ctx.lineWidth = 2;
                            ctx.setLineDash([4, 3]);
                            ctx.beginPath();
                            ctx.arc(0, 0, 15, 0, Math.PI * 2);
                            ctx.stroke();
                            
                            // 警告感叹号
                            ctx.fillStyle = '#f59e0b';
                            ctx.beginPath();
                            ctx.moveTo(0, -8);
                            ctx.lineTo(8, 6);
                            ctx.lineTo(-8, 6);
                            ctx.closePath();
                            ctx.fill();
                            
                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 9px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText("!", 0, 4);
                            
                            ctx.restore();
                        }
                    });
                }

                // 4. 车轮绘制
                const isMonster = this.type === 'monster';
                const wheelRad = isMonster ? 32 : 22;
                const wheelY = this.h - 5;
                const frontWheelX = this.w - 35;
                const rearWheelX = 35;

                const drawWheel = (wx, wy, dirtVal) => {
                    ctx.save();
                    ctx.translate(wx, wy);
                    ctx.rotate(this.wheelAngle);

                    ctx.fillStyle = '#1f2937';
                    ctx.strokeStyle = '#030712';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(0, 0, wheelRad, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = '#374151';
                    ctx.lineWidth = 3;
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(a) * (wheelRad - 6), Math.sin(a) * (wheelRad - 6));
                        ctx.lineTo(Math.cos(a) * wheelRad, Math.sin(a) * wheelRad);
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#e5e7eb';
                    ctx.strokeStyle = '#2e1065';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, wheelRad * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#9ca3af';
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fill();

                    if (dirtVal > 0) {
                        ctx.save();
                        ctx.rotate(-this.wheelAngle);
                        ctx.fillStyle = `rgba(110, 75, 35, ${0.9 * (dirtVal / 100)})`;
                        ctx.beginPath();
                        ctx.arc(0, 0, wheelRad + 1, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = `rgba(75, 45, 20, ${0.95 * (dirtVal / 100)})`;
                        for (let i = 0; i < 3; i++) {
                            const angle = i * 2.2;
                            const mx = Math.cos(angle) * (wheelRad * 0.5);
                            const my = Math.sin(angle) * (wheelRad * 0.5);
                            ctx.beginPath();
                            ctx.arc(mx, my, 4 + i, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }

                    ctx.restore();
                };

                drawWheel(rearWheelX, wheelY, this.rearWheelDirt);
                drawWheel(frontWheelX, wheelY, this.frontWheelDirt);

                this.attachedBubbles.forEach(b => {
                    ctx.save();
                    ctx.globalAlpha = b.life;
                    
                    ctx.beginPath();
                    ctx.arc(b.ox, b.oy, b.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(b.ox - b.size * 0.3, b.oy - b.size * 0.3, b.size * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();

                    ctx.restore();
                });

                ctx.restore();
            }
        }


        // --- 4. 洗车设备区域设计 ---
        class EquipmentManager {
            constructor(canvasW) {
                // 轨道世界宽度设为 2700 像素，包含修车厂与加油站
                this.zones = [
                    { name: 'water1', start: 160, end: 280, x: 220, active: false },
                    { name: 'water2', start: 340, end: 480, x: 410, active: false },
                    { name: 'brush',  start: 520, end: 640, x: 580, active: false, angle: 0 },
                    { name: 'dryer',  start: 680, end: 780, x: 730, active: false, dryAnim: 0 },
                    { name: 'strips', start: 820, end: 920, x: 870, active: false },
                    // 修车厂区域
                    { name: 'inspector', start: 1060, end: 1220, x: 1140, active: false, inspectY: 160, inspectTargetY: 160, laserY: 0, laserDir: 1, scanProgress: 0 },
                    { name: 'screwdriver', start: 1300, end: 1460, x: 1380, active: false, armY: 160, armTargetY: 160, screwAngle: 0, repairProgress: 0 },
                    { name: 'wrench', start: 1520, end: 1680, x: 1600, active: false, armY: 160, armTargetY: 160, wrenchAngle: 0, repairProgress: 0 },
                    // 加油站区域
                    { name: 'gasStation', start: 1950, end: 2250, x: 2170, active: false, nozzleX: 2170, nozzleY: 280, nozzleAngle: 0 }
                ];

                this.stripAngles = [0, 0, 0, 0, 0, 0, 0];
                this.stripColors = ['#eab308', '#22c55e', '#eab308', '#22c55e', '#eab308', '#22c55e', '#eab308'];

                this.topBrushY = 160;
                this.topBrushTargetY = 160;
            }

            update(car, particles, washSpeed = 0.8) {
                const carCenterX = car.x + car.w / 2;

                this.zones.forEach(zone => {
                    const isOverlapping = (carCenterX > zone.start && carCenterX < zone.end);
                    zone.active = isOverlapping;
                });

                // 获取刷子和清水冲洗区的设备实例
                const brushZone = this.zones.find(z => z.name === 'brush');
                const rinseZone = this.zones.find(z => z.name === 'water2');
                const bubbleZone = this.zones.find(z => z.name === 'water1');
                const inspectorZone = this.zones.find(z => z.name === 'inspector');
                const screwdriverZone = this.zones.find(z => z.name === 'screwdriver');
                const wrenchZone = this.zones.find(z => z.name === 'wrench');
                const gasZone = this.zones.find(z => z.name === 'gasStation');

                // 冲水控制音效启动判定
                const inWaterZone = bubbleZone.active || rinseZone.active;
                const showWheelWater = (brushZone.active && Math.abs(car.vx) > 0.05);

                sound.setWaterSound((inWaterZone || showWheelWater) && Math.abs(car.vx) > 0.05);

                // 1. 喷淋嘴运作 (第一区挂泡泡 与 第二区清水大冲洗)
                if (bubbleZone.active || rinseZone.active) {
                    this.zones.forEach((zone) => {
                        if (zone.name === 'water1' || zone.name === 'water2') {
                            if (zone.active) {
                                if (Math.random() < 0.45) {
                                    const pX = zone.x + (Math.random() * 40 - 20);
                                    const pY = 100;
                                    particles.push(new Particle(pX, pY, 'water', (Math.random() * 2 - 1), 6 + Math.random() * 4));
                                }
                                
                                // 只有第一区（water1）会落下大量肥皂泡挂在小车身上
                                if (zone.name === 'water1' && Math.random() < 0.25) {
                                    const bx = zone.x + (Math.random() * 40 - 20);
                                    const by = 100;
                                    particles.push(new Particle(bx, by, 'bubble', (Math.random() * 1.5 - 0.75), 4 + Math.random() * 3));
                                }

                                particles.forEach(p => {
                                    if (p.type === 'water' && p.y > car.y && p.y < car.y + car.h && p.x > car.x && p.x < car.x + car.w) {
                                        p.vy = -p.vy * 0.2;
                                        p.vx += Math.random() * 2 - 1;
                                    }
                                    if (zone.name === 'water1' && p.type === 'bubble' && p.y > car.y && p.y < car.y + car.h && p.x > car.x && p.x < car.x + car.w) {
                                        car.attachBubble(p.x - car.x, p.y - car.y);
                                        p.life = 0;
                                    }
                                });
                            }
                        }
                    });
                }

                // --- 区域 2: 清水大冲洗区 (原为区域3，现提到了区域2，以先冲掉车身上的泡泡，防止被刷子摩擦掉) ---
                if (rinseZone.active) {
                    const localXStart = rinseZone.start - car.x;
                    const localXEnd = rinseZone.end - car.x;

                    for (let i = car.attachedBubbles.length - 1; i >= 0; i--) {
                        const b = car.attachedBubbles[i];
                        if (b.ox > localXStart - 20 && b.ox < localXEnd + 20) {
                            if (Math.random() < 0.08) {
                                const worldBubbleX = car.x + b.ox;
                                const worldBubbleY = car.y + b.oy;
                                
                                particles.push(new Particle(
                                    worldBubbleX, worldBubbleY, 'wheel_bubble',
                                    (Math.random() * 2 - 1), 2.5 + Math.random() * 2
                                ));
                                
                                car.attachedBubbles.splice(i, 1);

                                if (Math.random() < 0.2) {
                                    sound.playBubblePop();
                                }
                            }
                        }
                    }
                }

                // --- 区域 3: 旋转毛刷与洗轮胎区 ---
                sound.setBrushSound(brushZone.active && Math.abs(car.vx) > 0.05);

                if (brushZone.active) {
                    brushZone.angle += 0.15 + (washSpeed * 0.125);

                    // 气吊高度微调判断
                    const isUnderTopBrush = (car.x < brushZone.x + 35 && car.x + car.w > brushZone.x - 35);
                    if (isUnderTopBrush) {
                        if (car.type === 'sports') this.topBrushTargetY = 365;
                        else if (car.type === 'police') this.topBrushTargetY = 340;
                        else if (car.type === 'monster') this.topBrushTargetY = 330;
                        else if (car.type === 'bus') this.topBrushTargetY = 330;
                    } else {
                        this.topBrushTargetY = 160;
                    }

                    // 1. 车身毛刷洗刷
                    const localX = (brushZone.x - car.x);
                    if (localX > 0 && localX < car.w && this.topBrushY > 250) {
                        const cleared = car.brushAt(localX, 22);
                        const popped = car.popBubblesAt(localX, 22); // 如果还有极少数顽固泡泡在此被刷掉

                        if (cleared || popped) {
                            if (popped && Math.random() < 0.4) {
                                sound.playBubblePop();
                            }
                            if (Math.random() < 0.25) {
                                particles.push(new Particle(
                                    brushZone.x + (Math.random() * 10 - 5),
                                    car.y + Math.random() * (car.h - 20),
                                    'mud',
                                    (Math.random() * 6 - 3),
                                    -3 - Math.random() * 3
                                ));
                            }
                        }
                    }

                    // 2. 轮胎圆刷清洗判定 (轮胎位置相对 brushZone.x 的偏置位置)
                    const rearWheelWorldX = car.x + 35;
                    const frontWheelWorldX = car.x + 125;
                    const wheelWorldY = car.y + car.h - 5; // 475px

                    // 改用基于新 brushZone.x 的自适应相对坐标
                    const rearTireBrushX = brushZone.x - 45;
                    const frontTireBrushX = brushZone.x + 40;

                    if (Math.abs(rearWheelWorldX - rearTireBrushX) < 35) {
                        if (car.rearWheelDirt > 0) {
                            car.rearWheelDirt = Math.max(0, car.rearWheelDirt - 1.5);
                            car.calcCleanliness();
                            if (Math.random() < 0.6) {
                                particles.push(new Particle(rearWheelWorldX + (Math.random() * 16 - 8), wheelWorldY + 12, 'wheel_water', (Math.random() * 2 - 1), -4 - Math.random() * 3));
                            }
                            if (Math.random() < 0.3) {
                                particles.push(new Particle(rearWheelWorldX + (Math.random() * 20 - 10), wheelWorldY, 'wheel_bubble', (Math.random() * 2 - 1), -2 - Math.random() * 2));
                            }
                            if (Math.random() < 0.2) {
                                particles.push(new Particle(rearWheelWorldX, wheelWorldY, 'mud', (Math.random() * 4 - 2), -2 - Math.random() * 2));
                            }
                        }
                    }

                    if (Math.abs(frontWheelWorldX - frontTireBrushX) < 35) {
                        if (car.frontWheelDirt > 0) {
                            car.frontWheelDirt = Math.max(0, car.frontWheelDirt - 1.5);
                            car.calcCleanliness();
                            if (Math.random() < 0.6) {
                                particles.push(new Particle(frontWheelWorldX + (Math.random() * 16 - 8), wheelWorldY + 12, 'wheel_water', (Math.random() * 2 - 1), -4 - Math.random() * 3));
                            }
                            if (Math.random() < 0.3) {
                                particles.push(new Particle(frontWheelWorldX + (Math.random() * 20 - 10), wheelWorldY, 'wheel_bubble', (Math.random() * 2 - 1), -2 - Math.random() * 2));
                            }
                            if (Math.random() < 0.2) {
                                particles.push(new Particle(frontWheelWorldX, wheelWorldY, 'mud', (Math.random() * 4 - 2), -2 - Math.random() * 2));
                            }
                        }
                    }
                } else {
                    this.topBrushTargetY = 160;
                }

                this.topBrushY += (this.topBrushTargetY - this.topBrushY) * 0.15;

                // --- 区域 4: 吹风烘干区 ---
                const dryerZone = this.zones[3];
                sound.setDryerSound(dryerZone.active && Math.abs(car.vx) > 0.05);

                if (dryerZone.active) {
                    dryerZone.dryAnim += 0.15;
                    if (Math.random() < 0.5) {
                        const px = dryerZone.x + Math.sin(dryerZone.dryAnim) * 15;
                        particles.push(new Particle(
                            px, 100, 'wind', 
                            Math.sin(dryerZone.dryAnim) * 3, 8 + Math.random() * 5
                        ));
                    }
                }

                // --- 区域 5: 擦车布条 ---
                const stripZone = this.zones[4];
                this.stripAngles.forEach((angle, idx) => {
                    const stripX = stripZone.start + idx * 16;
                    const contact = (car.x < stripX && car.x + car.w > stripX);
                    if (contact) {
                        const pushForce = Math.sin(Date.now() * 0.015 + idx) * 0.4 * (Math.abs(car.vx) > 0.1 ? 1 : 0.2);
                        this.stripAngles[idx] += (pushForce - this.stripAngles[idx]) * 0.2;
                    } else {
                        this.stripAngles[idx] += (Math.sin(Date.now() * 0.003 + idx) * 0.05 - this.stripAngles[idx]) * 0.05;
                    }
                });

                // ============================================
                // 🛠️ --- 区域 6: 受损检查器 (Inspector) ---
                // ============================================
                const isUnderInspector = (carCenterX > inspectorZone.start && carCenterX < inspectorZone.end);
                if (isUnderInspector) {
                    inspectorZone.inspectTargetY = 270; // 降低探头
                    if (inspectorZone.inspectY > 250) {
                        if (inspectorZone.scanProgress < 100) {
                            inspectorZone.scanProgress += 1.25;
                            // 扫描线上下运动
                            inspectorZone.laserY += inspectorZone.laserDir * 2.5;
                            if (inspectorZone.laserY > 90 || inspectorZone.laserY < 0) {
                                inspectorZone.laserDir *= -1;
                            }
                            if (Math.floor(Date.now() / 150) % 3 === 0) {
                                sound.playScan();
                            }
                        } else {
                            car.isInspected = true;
                        }
                    }
                } else {
                    inspectorZone.inspectTargetY = 160;
                    inspectorZone.scanProgress = 0;
                }
                inspectorZone.inspectY += (inspectorZone.inspectTargetY - inspectorZone.inspectY) * 0.12;

                // ============================================
                // 🛠️ --- 区域 7: 自动螺丝刀 (Screwdriver) ---
                // ============================================
                const isUnderScrewdriver = (carCenterX > screwdriverZone.start && carCenterX < screwdriverZone.end);
                if (isUnderScrewdriver && car.isInspected && !car.damagePoints[0].repaired) {
                    const targetX = car.x + car.damagePoints[0].ox;
                    screwdriverZone.armTargetY = car.y + car.damagePoints[0].oy - 35; // 刚好点到螺丝

                    if (Math.abs(screwdriverZone.armY - screwdriverZone.armTargetY) < 12) {
                        if (screwdriverZone.repairProgress < 100) {
                            screwdriverZone.repairProgress += 1.8;
                            screwdriverZone.screwAngle += 0.45;
                            sound.setScrewdriverSound(true);

                            // 产生火花
                            if (Math.random() < 0.4) {
                                particles.push(new Particle(targetX + (Math.random() * 6 - 3), screwdriverZone.armY + 35, 'sparkle', Math.random() * 4 - 2, -2 - Math.random() * 2));
                            }
                        } else {
                            car.damagePoints[0].repaired = true;
                            sound.setScrewdriverSound(false);
                            sound.playSuccessArpeggio();
                        }
                    }
                } else {
                    screwdriverZone.armTargetY = 160;
                    screwdriverZone.repairProgress = 0;
                    sound.setScrewdriverSound(false);
                }
                screwdriverZone.armY += (screwdriverZone.armTargetY - screwdriverZone.armY) * 0.12;

                // ============================================
                // 🛠️ --- 区域 8: 自动扳手 (Wrench) ---
                // ============================================
                const isUnderWrench = (carCenterX > wrenchZone.start && carCenterX < wrenchZone.end);
                if (isUnderWrench && car.isInspected && !car.damagePoints[1].repaired) {
                    const targetX = car.x + car.damagePoints[1].ox;
                    wrenchZone.armTargetY = car.y + car.damagePoints[1].oy - 35;

                    if (Math.abs(wrenchZone.armY - wrenchZone.armTargetY) < 12) {
                        if (wrenchZone.repairProgress < 100) {
                            wrenchZone.repairProgress += 1.8;
                            wrenchZone.wrenchAngle = Math.sin(Date.now() * 0.02) * 0.5;
                            sound.setWrenchSound(true);

                            // 产生火花
                            if (Math.random() < 0.3) {
                                particles.push(new Particle(targetX + (Math.random() * 6 - 3), wrenchZone.armY + 35, 'sparkle', Math.random() * 3 - 1.5, -2 - Math.random() * 2));
                            }
                        } else {
                            car.damagePoints[1].repaired = true;
                            car.damage = 0; // 破损清零，整车修好
                            sound.setWrenchSound(false);
                            sound.playSuccessArpeggio();
                        }
                    }
                } else {
                    wrenchZone.armTargetY = 160;
                    wrenchZone.repairProgress = 0;
                    sound.setWrenchSound(false);
                }
                wrenchZone.armY += (wrenchZone.armTargetY - wrenchZone.armY) * 0.12;

                // ============================================
                // ⛽ --- 区域 9: 加油机与油枪 (Gas Nozzle) ---
                // ============================================
                const isUnderGas = (carCenterX > gasZone.start && carCenterX < gasZone.end);
                const nozzleTargetX = car.x + (car.type === 'concrete' ? 55 : 25); // 水泥卡车油箱在侧面，其余在尾部
                const nozzleTargetY = car.y + car.h - 32;

                if (isUnderGas && car.fuel < 100) {
                    // 油枪平滑追踪
                    gasZone.nozzleX += (nozzleTargetX - gasZone.nozzleX) * 0.12;
                    gasZone.nozzleY += (nozzleTargetY - gasZone.nozzleY) * 0.12;

                    const closeToPort = Math.abs(gasZone.nozzleX - nozzleTargetX) < 10 && Math.abs(gasZone.nozzleY - nozzleTargetY) < 10;
                    if (closeToPort) {
                        gasZone.nozzleAngle = -Math.PI / 6; // 稍微插下去的倾角
                        car.fuel = Math.min(100, car.fuel + 0.65);
                        sound.setFuelSound(true);

                        // 绿色油滴 sparkle
                        if (Math.random() < 0.45) {
                            particles.push(new Particle(gasZone.nozzleX, gasZone.nozzleY, 'sparkle', Math.random() * 2 - 1, -1 - Math.random() * 2));
                        }

                        if (car.fuel >= 100) {
                            sound.setFuelSound(false);
                            sound.playSuccessArpeggio();
                            // 庆祝粒子
                            for (let i = 0; i < 30; i++) {
                                particles.push(new Particle(car.x + car.w / 2, car.y + 20, 'sparkle', Math.random() * 8 - 4, -3 - Math.random() * 5));
                            }
                        }
                    } else {
                        gasZone.nozzleAngle = 0;
                        sound.setFuelSound(false);
                    }
                } else {
                    // 挂在加油机壁上
                    const homeX = gasZone.x;
                    const homeY = 280;
                    gasZone.nozzleX += (homeX - gasZone.nozzleX) * 0.12;
                    gasZone.nozzleY += (homeY - gasZone.nozzleY) * 0.12;
                    gasZone.nozzleAngle = 0;
                    sound.setFuelSound(false);
                }
            }

            draw(ctx, car) {
                ctx.save();
                
                // 1. 轨道上方长钢梁
                ctx.strokeStyle = '#c084fc';
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(80, 75);
                ctx.lineTo(2620, 75);
                ctx.stroke();

                ctx.strokeStyle = '#e9d5ff';
                ctx.lineWidth = 4;

                this.zones.forEach(zone => {
                    // 绘制顶端垂吊绳
                    ctx.save();
                    ctx.strokeStyle = '#e9d5ff';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(zone.x, 75);
                    ctx.lineTo(zone.x, 100);
                    ctx.stroke();
                    ctx.restore();

                    if (zone.name === 'water1' || zone.name === 'water2') {
                        ctx.fillStyle = '#ec4899';
                        ctx.fillRect(zone.x - 15, 95, 30, 15);
                        ctx.fillStyle = '#a855f7';
                        ctx.fillRect(zone.x - 22, 110, 44, 8);
                        
                        ctx.fillStyle = '#2e1065';
                        for(let i=0; i<3; i++) {
                            ctx.beginPath();
                            ctx.arc(zone.x - 12 + i * 12, 116, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (zone.name === 'brush') {
                        // 1. 上刷系统：气动套筒连杆
                        ctx.save();
                        
                        const cylinderBottom = 150;
                        ctx.strokeStyle = '#64748b';
                        ctx.lineWidth = 14;
                        ctx.lineCap = 'butt';
                        ctx.beginPath();
                        ctx.moveTo(zone.x, 75);
                        ctx.lineTo(zone.x, cylinderBottom);
                        ctx.stroke();

                        ctx.fillStyle = '#eab308';
                        ctx.fillRect(zone.x - 9, cylinderBottom - 4, 18, 5);

                        ctx.strokeStyle = '#cbd5e1';
                        ctx.lineWidth = 6;
                        ctx.beginPath();
                        ctx.moveTo(zone.x, cylinderBottom);
                        ctx.lineTo(zone.x, this.topBrushY);
                        ctx.stroke();

                        ctx.translate(zone.x, this.topBrushY);
                        ctx.rotate(zone.angle);

                        const discRadius = 45;
                        const stripes = 12;
                        for(let i=0; i<stripes; i++) {
                            ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#3b82f6';
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.arc(0, 0, discRadius, (i * Math.PI * 2) / stripes, ((i+1) * Math.PI * 2) / stripes);
                            ctx.closePath();
                            ctx.fill();
                        }
                        
                        ctx.fillStyle = '#1e3a8a';
                        ctx.beginPath();
                        ctx.arc(0, 0, 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();

                        // 2. 车身侧面侧刷
                        ctx.save();
                        ctx.strokeStyle = '#93c5fd';
                        ctx.lineWidth = 5;
                        ctx.beginPath();
                        ctx.moveTo(zone.x, 75);
                        ctx.lineTo(zone.x - 55, 370);
                        ctx.moveTo(zone.x, 75);
                        ctx.lineTo(zone.x + 55, 370);
                        ctx.stroke();

                        const drawSideBrush = (sx, sy) => {
                            ctx.save();
                            ctx.translate(sx, sy);
                            ctx.rotate(-zone.angle * 1.5);
                            const r = 28;
                            for(let i=0; i<8; i++) {
                                ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#3b82f6';
                                ctx.beginPath();
                                ctx.moveTo(0, 0);
                                ctx.arc(0, 0, r, (i * Math.PI * 2) / 8, ((i+1) * Math.PI * 2) / 8);
                                ctx.closePath();
                                ctx.fill();
                            }
                            ctx.fillStyle = '#1e3a8a';
                            ctx.beginPath();
                            ctx.arc(0, 0, 8, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        };
                        drawSideBrush(zone.x - 55, 370);
                        drawSideBrush(zone.x + 55, 370);
                        ctx.restore();

                        // 3. 两个轮胎毛刷 (基于当前 zone.x 相对定位)
                        const drawTireBrush = (tx, ty) => {
                            ctx.save();
                            ctx.translate(tx, ty);
                            ctx.rotate(zone.angle * 2.2);
                            
                            const rRadius = 24;
                            const teeth = 8;
                            for(let i=0; i<teeth; i++) {
                                ctx.fillStyle = i % 2 === 0 ? '#ef4444' : '#3b82f6';
                                ctx.beginPath();
                                ctx.moveTo(0, 0);
                                ctx.arc(0, 0, rRadius, (i * Math.PI * 2) / teeth, ((i+1) * Math.PI * 2) / teeth);
                                ctx.closePath();
                                ctx.fill();
                                
                                ctx.save();
                                ctx.rotate((i * Math.PI * 2) / teeth + (Math.PI / teeth / 2));
                                ctx.fillRect(rRadius - 2, -4, 6, 8);
                                ctx.restore();
                            }
                            ctx.fillStyle = '#1e293b';
                            ctx.beginPath();
                            ctx.arc(0, 0, 7, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();

                            ctx.strokeStyle = '#64748b';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.moveTo(tx, ty);
                            ctx.lineTo(tx, ty + 18);
                            ctx.stroke();
                        };

                        drawTireBrush(zone.x - 45, 475);
                        drawTireBrush(zone.x + 40, 475);

                        // 4. 低位轮胎喷嘴 (基于 zone.x 相对定位)
                        const drawTireNozzle = (nx, ny, angle) => {
                            ctx.save();
                            ctx.translate(nx, ny);
                            ctx.rotate(angle);
                            ctx.fillStyle = '#a855f7';
                            ctx.fillRect(-10, -4, 20, 8);
                            ctx.fillStyle = '#ec4899';
                            ctx.fillRect(4, -6, 6, 12);
                            ctx.restore();
                        };
                        drawTireNozzle(zone.x - 80, 480, -Math.PI / 4);   // 左低位喷头
                        drawTireNozzle(zone.x + 75, 480, Math.PI / 4 + Math.PI); // 右低位喷头
                    } else if (zone.name === 'dryer') {
                        ctx.save();
                        ctx.translate(zone.x, 100);
                        ctx.fillStyle = '#f97316';
                        ctx.beginPath();
                        ctx.arc(0, 5, 20, Math.PI, 0);
                        ctx.lineTo(25, 25);
                        ctx.lineTo(-25, 25);
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(-28, 25, 56, 6);
                        
                        ctx.fillStyle = '#7c2d12';
                        ctx.beginPath();
                        ctx.arc(0, 0, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else if (zone.name === 'strips') {
                        ctx.save();
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(zone.start - 10, 95, (zone.end - zone.start) + 20, 10);
                        
                        const count = 7;
                        const stripH = 140;
                        for(let i=0; i<count; i++) {
                            const sx = zone.start + i * 16;
                            const angle = this.stripAngles[i];
                            
                            ctx.save();
                            ctx.translate(sx, 105);
                            ctx.rotate(angle);

                            ctx.fillStyle = this.stripColors[i];
                            ctx.fillRect(-5, 0, 10, stripH);
                            
                            ctx.fillStyle = '#1e293b';
                            ctx.fillRect(-5, stripH - 8, 10, 3);
                            ctx.fillRect(-5, stripH - 4, 10, 3);
                            
                            ctx.restore();
                        }
                        ctx.restore();
                    } else if (zone.name === 'inspector') {
                        // 绘制扫描仪挂载吊臂
                        ctx.save();
                        ctx.strokeStyle = '#64748b';
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.moveTo(zone.x, 75);
                        ctx.lineTo(zone.x, zone.inspectY);
                        ctx.stroke();

                        // 扫描仪外壳
                        ctx.translate(zone.x, zone.inspectY);
                        ctx.fillStyle = '#475569';
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.roundRect(-45, 0, 90, 22, 6);
                        ctx.fill();
                        ctx.stroke();

                        // 状态发光灯
                        ctx.fillStyle = (zone.scanProgress > 0 && zone.scanProgress < 100) ? (Math.floor(Date.now() / 150) % 2 === 0 ? '#22c55e' : '#ef4444') : '#3b82f6';
                        ctx.beginPath();
                        ctx.arc(-30, 11, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // 红色激光发射板
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(-15, 18, 30, 4);

                        // 扫描激光面与线条
                        if (zone.inspectY > 250 && zone.scanProgress > 0 && zone.scanProgress < 100) {
                            const grad = ctx.createLinearGradient(0, 22, 0, 190);
                            grad.addColorStop(0, 'rgba(34, 197, 94, 0.4)');
                            grad.addColorStop(1, 'rgba(34, 197, 94, 0.02)');
                            ctx.fillStyle = grad;
                            ctx.fillRect(-40, 22, 80, 170);

                            ctx.strokeStyle = '#4ade80';
                            ctx.lineWidth = 4;
                            ctx.beginPath();
                            ctx.moveTo(-40, 22 + zone.laserY);
                            ctx.lineTo(40, 22 + zone.laserY);
                            ctx.stroke();

                            ctx.fillStyle = '#22c55e';
                            ctx.font = 'bold 12px Fredoka';
                            ctx.textAlign = 'center';
                            ctx.fillText(`SCANNING: ${Math.round(zone.scanProgress)}%`, 0, -8);
                        } else if (zone.inspectY > 250 && zone.scanProgress >= 100) {
                            ctx.fillStyle = '#22c55e';
                            ctx.font = 'bold 12px Fredoka';
                            ctx.textAlign = 'center';
                            ctx.fillText("OK", 0, -8);
                        }
                        ctx.restore();
                    } else if (zone.name === 'screwdriver') {
                        ctx.save();
                        ctx.strokeStyle = '#64748b';
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.moveTo(zone.x, 75);
                        ctx.lineTo(zone.x, zone.armY);
                        ctx.stroke();

                        ctx.translate(zone.x, zone.armY);
                        
                        // 黄色卡通把柄
                        ctx.fillStyle = '#eab308';
                        ctx.strokeStyle = '#1e293b';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.roundRect(-10, 0, 20, 25, 4);
                        ctx.fill();
                        ctx.stroke();

                        // 螺丝刀金属柄
                        ctx.fillStyle = '#94a3b8';
                        ctx.fillRect(-3, 25, 6, 12);

                        // 十字刀头
                        ctx.save();
                        ctx.translate(0, 37);
                        ctx.rotate(zone.screwAngle);
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(-6, -2, 12, 4);
                        ctx.fillRect(-2, -6, 4, 12);
                        ctx.restore();

                        if (zone.repairProgress > 0 && zone.repairProgress < 100) {
                            ctx.fillStyle = '#eab308';
                            ctx.font = 'bold 10px Fredoka';
                            ctx.textAlign = 'center';
                            ctx.fillText("FIXING...", 0, -8);
                        }
                        ctx.restore();
                    } else if (zone.name === 'wrench') {
                        ctx.save();
                        ctx.strokeStyle = '#64748b';
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.moveTo(zone.x, 75);
                        ctx.lineTo(zone.x, zone.armY);
                        ctx.stroke();

                        ctx.translate(zone.x, zone.armY);

                        // 卡通蓝色握柄
                        ctx.fillStyle = '#3b82f6';
                        ctx.strokeStyle = '#1e293b';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.roundRect(-10, 0, 20, 20, 4);
                        ctx.fill();
                        ctx.stroke();

                        // 摆动扳手身
                        ctx.save();
                        ctx.translate(0, 15);
                        ctx.rotate(zone.wrenchAngle);
                        ctx.fillStyle = '#94a3b8';
                        ctx.fillRect(-4, 0, 8, 18);
                        
                        // 开口金属头部
                        ctx.strokeStyle = '#475569';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 22, 8, -Math.PI / 6, Math.PI + Math.PI / 6, true);
                        ctx.stroke();
                        ctx.restore();

                        if (zone.repairProgress > 0 && zone.repairProgress < 100) {
                            ctx.fillStyle = '#3b82f6';
                            ctx.font = 'bold 10px Fredoka';
                            ctx.textAlign = 'center';
                            ctx.fillText("TUNING...", 0, -8);
                        }
                        ctx.restore();
                    } else if (zone.name === 'gasStation') {
                        // 1. 绘制加油柜
                        ctx.save();
                        ctx.fillStyle = '#ef4444';
                        ctx.strokeStyle = '#1e293b';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.roundRect(zone.x - 25, 270, 50, 170, 10);
                        ctx.fill();
                        ctx.stroke();

                        // 加油柜底框
                        ctx.fillStyle = '#f59e0b';
                        ctx.fillRect(zone.x - 20, 420, 40, 20);

                        // LCD 屏
                        ctx.fillStyle = '#065f46';
                        ctx.fillRect(zone.x - 18, 290, 36, 32);
                        
                        // LCD 文字
                        ctx.fillStyle = '#34d399';
                        ctx.font = '11px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText("FUEL", zone.x, 301);
                        ctx.font = 'bold 13px Courier New';
                        ctx.fillText(`${Math.round(car.fuel)}%`, zone.x, 316);

                        // 2. 黑色油管线 (二次贝塞尔曲线)
                        ctx.strokeStyle = '#1e293b';
                        ctx.lineWidth = 6;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(zone.x - 20, 360);
                        const ctrlX = (zone.x - 20 + zone.nozzleX) / 2;
                        const ctrlY = Math.max(380, zone.nozzleY + 50);
                        ctx.quadraticCurveTo(ctrlX, ctrlY, zone.nozzleX, zone.nozzleY);
                        ctx.stroke();

                        // 3. 加油枪嘴
                        ctx.translate(zone.nozzleX, zone.nozzleY);
                        ctx.rotate(zone.nozzleAngle);

                        ctx.fillStyle = '#eab308';
                        ctx.strokeStyle = '#1e293b';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(15, -5);
                        ctx.lineTo(20, 5);
                        ctx.lineTo(8, 12);
                        ctx.lineTo(-4, 6);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = '#64748b';
                        ctx.fillRect(15, -4, 12, 5);

                        ctx.restore();
                    }
                });

                ctx.restore();
            }
        }


        // --- 5. 核心游戏循环与界面控制 ---
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.car = new Car('sports');
                
                // 设定长轨道的总世界宽度为 2700
                this.worldWidth = 2700;
                
                this.equipment = new EquipmentManager(this.canvas.width);
                this.particles = [];

                this.stars = 0;
                this.autoMode = false;
                
                this.washSpeed = 0.8;

                this.keys = {};
                this.conveyorOffset = 0;
                this.cameraX = 0; // 摄像机滚动偏移量

                this.initEvents();
                this.gameLoop();
            }

            initEvents() {
                window.addEventListener('keydown', e => {
                    this.keys[e.key] = true;
                    sound.init();

                    if (e.key === 'ArrowLeft') {
                        this.moveBack();
                    } else if (e.key === 'ArrowRight') {
                        this.moveForward();
                    } else if (e.key === 'ArrowDown') {
                        this.stopCar();
                    }
                });

                window.addEventListener('keyup', e => {
                    this.keys[e.key] = false;
                });

                document.getElementById('btn-back').addEventListener('mousedown', () => { sound.playClick(); this.moveBack(); });
                document.getElementById('btn-stop').addEventListener('mousedown', () => { sound.playClick(); this.stopCar(); });
                document.getElementById('btn-forward').addEventListener('mousedown', () => { sound.playClick(); this.moveForward(); });

                document.getElementById('btn-back').addEventListener('touchstart', (e) => { e.preventDefault(); sound.playClick(); this.moveBack(); });
                document.getElementById('btn-stop').addEventListener('touchstart', (e) => { e.preventDefault(); sound.playClick(); this.stopCar(); });
                document.getElementById('btn-forward').addEventListener('touchstart', (e) => { e.preventDefault(); sound.playClick(); this.moveForward(); });

                const autoBtn = document.getElementById('btn-auto');
                autoBtn.addEventListener('click', () => {
                    sound.playClick();
                    this.autoMode = !this.autoMode;
                    if (this.autoMode) {
                        autoBtn.classList.add('active');
                        autoBtn.innerHTML = '✨ 自动服务中... 点击取消 ✨';
                        if (this.car.x > 2400 || this.car.cleanedSparklesTriggered) {
                            this.car.x = 80;
                            this.car.resetDirt();
                        }
                    } else {
                        autoBtn.classList.remove('active');
                        autoBtn.innerHTML = '✨ 自动服务 ✨';
                        this.stopCar();
                    }
                });

                const carBtns = document.querySelectorAll('.car-btn');
                carBtns.forEach(btn => {
                    btn.addEventListener('click', e => {
                        sound.playClick();
                        carBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        const carType = btn.getAttribute('data-car');
                        this.car = new Car(carType);
                        this.autoMode = false;
                        autoBtn.classList.remove('active');
                        autoBtn.innerHTML = '✨ 自动服务 ✨';
                    });
                });

                const speedSlider = document.getElementById('speed-slider');
                const speedValueText = document.getElementById('speed-value');
                speedSlider.addEventListener('input', e => {
                    this.washSpeed = parseFloat(e.target.value);
                    if (this.washSpeed < 0.6) speedValueText.innerText = "超慢 🐌";
                    else if (this.washSpeed < 1.2) speedValueText.innerText = "慢速 🐢";
                    else if (this.washSpeed < 1.8) speedValueText.innerText = "中速 🚗";
                    else speedValueText.innerText = "快速 ⚡";
                });

                const volSlider = document.getElementById('volume-slider');
                volSlider.addEventListener('input', e => {
                    sound.setVolume(parseFloat(e.target.value));
                });

                const audioBtn = document.getElementById('audio-toggle-btn');
                audioBtn.addEventListener('click', () => {
                    const isMuted = sound.toggleMute();
                    if (isMuted) {
                        audioBtn.classList.add('muted');
                        audioBtn.innerHTML = '音乐：已关 🔇';
                    } else {
                        audioBtn.classList.remove('muted');
                        audioBtn.innerHTML = '音乐：开启 🎵';
                    }
                });
            }

            moveBack() {
                this.autoMode = false;
                document.getElementById('btn-auto').classList.remove('active');
                document.getElementById('btn-auto').innerHTML = '✨ 自动服务 ✨';
                this.car.targetVx = -2.2 * this.washSpeed;
            }

            moveForward() {
                this.autoMode = false;
                document.getElementById('btn-auto').classList.remove('active');
                document.getElementById('btn-auto').innerHTML = '✨ 自动服务 ✨';
                this.car.targetVx = 2.2 * this.washSpeed;
            }

            stopCar() {
                this.car.targetVx = 0;
            }

            update() {
                if (this.autoMode) {
                    const carCenterX = this.car.x + this.car.w / 2;
                    
                    if (this.car.cleanliness < 100) {
                        // 1. 洗车阶段，慢速前行
                        this.car.targetVx = 1.0 * this.washSpeed;
                    } else if (!this.car.isInspected) {
                        // 2. 检查阶段，开到检查器下 (中心在1140) 停下扫描
                        if (carCenterX < 1136) {
                            this.car.targetVx = 1.2 * this.washSpeed;
                        } else if (carCenterX > 1144) {
                            this.car.targetVx = -1.2 * this.washSpeed;
                        } else {
                            this.car.targetVx = 0; // 停在检查器下方进行扫描
                        }
                    } else if (!this.car.damagePoints[0].repaired) {
                        // 3. 螺丝刀修复阶段，开到螺丝刀下 (对准螺丝点 1380 - ox 45) 停下修理
                        const targetX = 1380 - this.car.damagePoints[0].ox;
                        if (this.car.x < targetX - 4) {
                            this.car.targetVx = 1.0 * this.washSpeed;
                        } else if (this.car.x > targetX + 4) {
                            this.car.targetVx = -1.0 * this.washSpeed;
                        } else {
                            this.car.targetVx = 0;
                        }
                    } else if (!this.car.damagePoints[1].repaired) {
                        // 4. 扳手修复阶段，开到扳手下 (对准裂纹点 1600 - ox 115) 停下修理
                        const targetX = 1600 - this.car.damagePoints[1].ox;
                        if (this.car.x < targetX - 4) {
                            this.car.targetVx = 1.0 * this.washSpeed;
                        } else if (this.car.x > targetX + 4) {
                            this.car.targetVx = -1.0 * this.washSpeed;
                        } else {
                            this.car.targetVx = 0;
                        }
                    } else if (this.car.fuel < 100) {
                        // 5. 加油阶段，开到加油站 (对准加油口 2170 - ox 25) 停下加油
                        const targetX = 2170 - 25;
                        if (this.car.x < targetX - 5) {
                            this.car.targetVx = 1.2 * this.washSpeed;
                        } else if (this.car.x > targetX + 5) {
                            this.car.targetVx = -1.2 * this.washSpeed;
                        } else {
                            this.car.targetVx = 0;
                        }
                    } else {
                        // 6. 完工，以快速驶往最右端
                        if (this.car.x < this.worldWidth - 170) {
                            this.car.targetVx = 1.5 * this.washSpeed;
                        } else {
                            this.car.targetVx = 0;
                            this.autoMode = false;
                            document.getElementById('btn-auto').classList.remove('active');
                            document.getElementById('btn-auto').innerHTML = '✨ 自动服务 ✨';
                        }
                    }
                }

                // 物理更新
                this.car.update(this.worldWidth);
                this.conveyorOffset -= this.car.vx;
                
                // 平滑相机滚动跟随
                const targetCamX = this.car.x - this.canvas.width / 2 + this.car.w / 2;
                this.cameraX += (targetCamX - this.cameraX) * 0.12;
                this.cameraX = Math.max(0, Math.min(this.cameraX, this.worldWidth - this.canvas.width));

                this.equipment.update(this.car, this.particles, this.washSpeed);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                // 大满贯通关（洗车 100% 且 维修好 且 油加满）
                if (this.car.cleanliness >= 100 && this.car.damage <= 0 && this.car.fuel >= 100 && !this.car.cleanedSparklesTriggered) {
                    this.car.cleanedSparklesTriggered = true;
                    this.stars += 1;
                    document.getElementById('stars-value').innerText = this.stars;
                    
                    sound.playSuccessArpeggio();

                    const carCenterX = this.car.x + this.car.w / 2;
                    const carCenterY = this.car.y + this.car.h / 2;
                    for (let s = 0; s < 70; s++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 9;
                        this.particles.push(new Particle(
                            carCenterX, carCenterY - 15, 'sparkle',
                            Math.cos(angle) * speed, Math.sin(angle) * speed - 3
                        ));
                    }
                }
            }

            draw() {
                // 1. 全屏天空底色背景
                this.ctx.fillStyle = '#bae6fd';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 2. 远景：彩虹 (视差滚动 0.12)
                this.ctx.save();
                this.ctx.translate(-this.cameraX * 0.12, 0);
                const drawRainbow = (rx) => {
                    this.ctx.strokeStyle = 'rgba(252, 165, 165, 0.3)';
                    this.ctx.lineWidth = 15;
                    this.ctx.beginPath();
                    this.ctx.arc(rx, 500, 380, Math.PI, 0);
                    this.ctx.stroke();

                    this.ctx.strokeStyle = 'rgba(253, 224, 71, 0.25)';
                    this.ctx.beginPath();
                    this.ctx.arc(rx, 500, 365, Math.PI, 0);
                    this.ctx.stroke();

                    this.ctx.strokeStyle = 'rgba(147, 197, 253, 0.25)';
                    this.ctx.beginPath();
                    this.ctx.arc(rx, 500, 350, Math.PI, 0);
                    this.ctx.stroke();
                };
                drawRainbow(480);
                drawRainbow(1350);
                drawRainbow(2220);
                this.ctx.restore();

                // 3. 中景：草丘山丘 (视差滚动 0.28)
                this.ctx.save();
                this.ctx.translate(-this.cameraX * 0.28, 0);
                this.ctx.fillStyle = '#86efac';
                this.ctx.beginPath();
                this.ctx.arc(100, 540, 200, 0, Math.PI * 2);
                this.ctx.arc(500, 560, 280, 0, Math.PI * 2);
                this.ctx.arc(900, 540, 180, 0, Math.PI * 2);
                this.ctx.arc(1300, 550, 240, 0, Math.PI * 2);
                this.ctx.arc(1700, 540, 200, 0, Math.PI * 2);
                this.ctx.arc(2100, 560, 260, 0, Math.PI * 2);
                this.ctx.arc(2500, 540, 220, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();

                // 4. 近景世界元素 (平移 cameraX)
                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);

                // 绘制三大区域的玻璃背板
                const drawBackboard = (bx, bw, title, colorHex) => {
                    this.ctx.save();
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                    this.ctx.lineWidth = 8;
                    this.ctx.beginPath();
                    this.ctx.roundRect(bx, 80, bw, 380, 20);
                    this.ctx.fill();
                    this.ctx.stroke();
                    
                    // 写大区大标题
                    this.ctx.fillStyle = colorHex;
                    this.ctx.font = 'bold 22px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(title, bx + bw / 2, 55);
                    this.ctx.restore();
                };

                // 洗车大区
                drawBackboard(80, 860, "⭐ 智能洗车场 ⭐", "#7c3aed");
                // 修车大区
                drawBackboard(1000, 720, "🛠️ 卡通修车厂 🛠️", "#0f766e");
                
                // 加油站大区与加油棚屋顶
                drawBackboard(1800, 720, "⛽ 能量加油站 ⛽", "#b91c1c");
                
                // 绘制加油棚雨棚 (屋顶)
                this.ctx.save();
                // 绘制两个巨大的柱子
                const drawColumn = (cx) => {
                    this.ctx.fillStyle = '#cbd5e1';
                    this.ctx.fillRect(cx, 100, 24, 340);
                    this.ctx.strokeStyle = '#475569';
                    this.ctx.lineWidth = 3;
                    this.ctx.strokeRect(cx, 100, 24, 340);
                    // 蓝白色条纹装饰
                    this.ctx.fillStyle = '#ef4444';
                    for(let sy=120; sy<420; sy+=40) {
                        this.ctx.fillRect(cx + 1, sy, 22, 12);
                    }
                    // 方形柱基
                    this.ctx.fillStyle = '#64748b';
                    this.ctx.fillRect(cx - 6, 420, 36, 20);
                    this.ctx.strokeRect(cx - 6, 420, 36, 20);
                };
                drawColumn(1830);
                drawColumn(2466);
                
                // 绘制大型扁平遮雨棚屋顶 (梯形/圆弧)
                this.ctx.fillStyle = '#f87171'; // 粉红色大顶蓬
                this.ctx.strokeStyle = '#991b1b';
                this.ctx.lineWidth = 4;
                this.ctx.beginPath();
                this.ctx.roundRect(1780, 80, 740, 35, [10, 10, 0, 0]);
                this.ctx.fill();
                this.ctx.stroke();

                // 棚顶黄色下缘
                this.ctx.fillStyle = '#fbbf24';
                this.ctx.fillRect(1780, 115, 740, 8);

                // GAS 霓虹标牌
                this.ctx.fillStyle = '#fee2e2';
                this.ctx.strokeStyle = '#dc2626';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.roundRect(2100, 65, 100, 36, 6);
                this.ctx.fill();
                this.ctx.stroke();
                
                this.ctx.fillStyle = '#ef4444';
                this.ctx.font = 'bold 20px Fredoka';
                this.ctx.textAlign = 'center';
                this.ctx.fillText("GAS", 2150, 91);
                this.ctx.restore();

                // 传送带轨道钢架底座
                this.ctx.fillStyle = '#334155';
                this.ctx.fillRect(50, 440, 2600, 32);

                // 传送带左右的大滑轮齿轮
                const drawGear = (gx, gy) => {
                    this.ctx.save();
                    this.ctx.translate(gx, gy);
                    this.ctx.rotate(this.conveyorOffset * 0.05);
                    this.ctx.fillStyle = '#64748b';
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 16, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    this.ctx.fillStyle = '#475569';
                    for(let i=0; i<8; i++) {
                        this.ctx.rotate(Math.PI / 4);
                        this.ctx.fillRect(12, -4, 8, 8);
                    }
                    this.ctx.restore();
                };
                drawGear(65, 456);
                drawGear(2635, 456);

                // 传送带滚动小圆孔点
                this.ctx.fillStyle = '#f8fafc';
                const dotsCount = 140;
                const dotSpacing = 2540 / dotsCount;
                for (let i = 0; i < dotsCount; i++) {
                    const dotX = 80 + ((i * dotSpacing + this.conveyorOffset) % 2540 + 2540) % 2540;
                    this.ctx.beginPath();
                    this.ctx.arc(dotX, 456, 4, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // 依次渲染小车、设备、粒子
                this.car.draw(this.ctx);
                this.equipment.draw(this.ctx, this.car);
                this.particles.forEach(p => p.draw(this.ctx));

                this.ctx.restore();

                // 5. 绘制小车头顶的浮动进度条 (画在 HUD 空间)
                // 先计算小车在屏幕上的视觉 x 位置
                const screenCarX = this.car.x - this.cameraX;
                
                if (this.car.cleanliness < 100) {
                    // 洗车中
                    this.ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 50, this.car.y - 30, 100, 18);
                    
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 45, this.car.y - 25, 90, 8);
                    
                    this.ctx.fillStyle = '#22c55e';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 45, this.car.y - 25, 90 * (this.car.cleanliness / 100), 8);
                    
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = 'bold 10px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`洗车进度: ${this.car.cleanliness}%`, screenCarX + this.car.w/2, this.car.y - 32);
                } else if (!this.car.isInspected) {
                    // 洗干净了，但未扫描检查
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.font = 'bold 14px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText("⚠️ 检查: 请开往修车厂扫描!", screenCarX + this.car.w/2, this.car.y - 25);
                } else if (this.car.damage > 0) {
                    // 维修中
                    const repairedCount = this.car.damagePoints.filter(p => p.repaired).length;
                    const repairProgress = repairedCount * 50;

                    this.ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 50, this.car.y - 30, 100, 18);
                    
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 45, this.car.y - 25, 90, 8);
                    
                    this.ctx.fillStyle = '#06b6d4'; // 青色代表维修
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 45, this.car.y - 25, 90 * (repairProgress / 100), 8);
                    
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = 'bold 10px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`车辆维修: ${repairProgress}%`, screenCarX + this.car.w/2, this.car.y - 32);
                } else if (this.car.fuel < 100) {
                    // 加油中
                    this.ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 50, this.car.y - 30, 100, 18);
                    
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 45, this.car.y - 25, 90, 8);
                    
                    this.ctx.fillStyle = '#eab308'; // 黄色代表能量
                    this.ctx.fillRect(screenCarX + this.car.w/2 - 45, this.car.y - 25, 90 * (this.car.fuel / 100), 8);
                    
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = 'bold 10px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(`加油中: ${Math.round(this.car.fuel)}%`, screenCarX + this.car.w/2, this.car.y - 32);
                } else {
                    // 全部搞定
                    this.ctx.fillStyle = '#eab308';
                    this.ctx.font = 'bold 20px Fredoka';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText("✨ 能量加满！帅气出发！✨", screenCarX + this.car.w/2, this.car.y - 25);
                }
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        window.addEventListener('load', () => {
            new GameEngine();
        });
    </script>
</body>
</html>
